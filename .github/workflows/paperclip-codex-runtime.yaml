name: paperclip-codex-runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional extra image tag, e.g. v0.1.0
        required: false
        type: string
      tag_latest:
        description: Also tag latest
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags-ignore: ["*"]
    paths:
      - .github/workflows/paperclip-codex-runtime.yaml
      - docker/paperclip-agent-runtime/**
      - tools/paperclip-agent-shim/**

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/paperclip-agent-runtime-codex

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image tags
        id: tags
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          TAG_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_latest || false }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA}"

            if [ -n "${VERSION}" ]; then
              if ! [[ "${VERSION}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
                echo "Invalid Docker tag: ${VERSION}" >&2
                exit 1
              fi
              echo "${IMAGE_NAME}:${VERSION}"
            fi

            if [ "${TAG_LATEST}" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Codex runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/paperclip-agent-runtime/Dockerfile.codex
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
