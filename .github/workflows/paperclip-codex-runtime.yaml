name: paperclip-codex-runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional extra image tag, e.g. v0.1.0
        required: false
        type: string
      tag_latest:
        description: Also tag latest
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags-ignore: ["*"]
    paths:
      - .github/workflows/paperclip-codex-runtime.yaml
      - docker/paperclip-agent-runtime/**
      - tools/paperclip-agent-shim/**

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/paperclip-agent-runtime-codex

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
            fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Collect image tags
        id: tags
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          TAG_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_latest || false }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA}"

            if [ -n "${VERSION}" ]; then
              if ! [[ "${VERSION}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
                echo "Invalid Docker tag: ${VERSION}" >&2
                exit 1
              fi
              echo "${IMAGE_NAME}:${VERSION}"
            fi

            if [ "${TAG_LATEST}" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Codex runtime
        env:
          DOCKER_BUILDKIT: 1
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            tag_args+=("-t" "${tag}")
          done <<< "${TAGS}"

          docker build -f docker/paperclip-agent-runtime/Dockerfile.codex "${tag_args[@]}" .

      - name: Push Codex runtime
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            docker push "${tag}"
          done <<< "${TAGS}"
