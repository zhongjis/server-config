---
apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: paperclip
  namespace: paperclip
spec:
  image:
    repository: ghcr.io/paperclipai/paperclip
    tag: latest
    digest: sha256:c3b0e9a763b8e7f1ebcb360f6836aca28f3c698e8bcc8bed43275d93876e1279
    pullPolicy: IfNotPresent

  deployment:
    mode: authenticated
    exposure: public
    publicURL: https://paperclip.zshen.me
    allowedHostnames:
      - paperclip.zshen.me

  suspended: false

  env:
    - name: NODE_OPTIONS
      value: ""
    - name: PAPERCLIP_AUTH_BASE_URL_MODE
      value: explicit
    - name: PAPERCLIP_AUTH_PUBLIC_BASE_URL
      value: https://paperclip.zshen.me

  plugins:
    - name: "@paperclip/plugin-llm-wiki"

  database:
    mode: external
    externalURLSecretRef:
      name: paperclip-cnpg-cluster-app
      key: uri

  auth:
    secretRef:
      name: paperclip-secrets-flux
      key: BETTER_AUTH_SECRET
    disableSignUp: true

  storage:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: longhorn
      accessModes:
        - ReadWriteOnce

  adapters:
    apiKeysSecretRef:
      name: paperclip-secrets-flux

  initContainers:
    - name: install-github-netrc
      image: busybox:1.36
      command: ["/bin/sh", "-ec"]
      args:
        - |
          rm -rf /paperclip/.netrc
          if [ -f /github-netrc-secret/.netrc ]; then
            cp /github-netrc-secret/.netrc /paperclip/.netrc
          else
            echo "paperclip-secrets-flux .netrc key not present; installing empty .netrc"
            : > /paperclip/.netrc
          fi
          chown 1000:1000 /paperclip/.netrc
          chmod 0600 /paperclip/.netrc
      volumeMounts:
        - name: github-netrc-secret
          mountPath: /github-netrc-secret
          readOnly: true
        - name: paperclip-data
          mountPath: /paperclip
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
            - FOWNER
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault

  extraVolumes:
    - name: github-netrc-secret
      secret:
        secretName: paperclip-secrets-flux
        optional: true
        items:
          - key: .netrc
            path: .netrc
            mode: 0444
  networking:
    service:
      type: ClusterIP
      port: 3100
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - paperclip.zshen.me
      tls:
        - hosts:
            - paperclip.zshen.me
          secretName: paperclip-tls
      annotations:
        gethomepage.dev/description: AI agent management workspace.
        gethomepage.dev/enabled: "true"
        gethomepage.dev/external: "true"
        gethomepage.dev/group: Applications
        gethomepage.dev/name: Paperclip
        kubernetes.io/tls-acme: "true"
        nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

  observability:
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
    logging:
      level: info

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
