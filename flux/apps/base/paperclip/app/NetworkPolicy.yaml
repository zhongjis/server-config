---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperclip-apiserver-egress
  namespace: paperclip
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: paperclip
      app.kubernetes.io/name: paperclip
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.50.103/32
        - ipBlock:
            cidr: 192.168.50.104/32
        - ipBlock:
            cidr: 192.168.50.105/32
      ports:
        - protocol: TCP
          port: 6443
