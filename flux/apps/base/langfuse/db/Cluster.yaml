---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/all.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse-cnpg-cluster
  namespace: langfuse
spec:
  interval: 30m
  # Disk-full checks block hibernation; pause reconciliation before removing database pods.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: postgresql.cnpg.io
              kind: Cluster
              name: langfuse-cnpg-cluster
            patch: |
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: langfuse-cnpg-cluster
                annotations:
                  cnpg.io/hibernation: "on"
                  cnpg.io/reconciliationLoop: "disabled"
  chart:
    spec:
      chart: cluster
      version: 0.5.0
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system
      interval: 12h
  values:
    type: postgresql
    version:
      postgresql: "18"
    mode: standalone
    cluster:
      instances: 2
      affinity:
        topologyKey: kubernetes.io/hostname
      storage:
        size: 5Gi
        storageClass: "longhorn"
      initdb:
        database: langfuse
        owner: langfuse_user
      monitoring:
        enabled: true
        podMonitorEnabled: true
