apiVersion: v1
kind: Secret
metadata:
  name: paperclip-github-netrc
  namespace: paperclip
type: Opaque
stringData:
  # Replace placeholders, then encrypt the real file with sops before adding it to kustomization.yaml.
  # Fine-grained PAT for private repo clone/fetch needs Contents: Read.
  # Add Contents: Read and write for branch pushes; Pull requests: Read and write for PR API work.
  .netrc: |
    machine github.com
      login x-access-token
      password <github-pat>
